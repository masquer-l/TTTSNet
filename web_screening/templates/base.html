<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SFY 数据筛选{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .preview-thumb { width: 160px; height: 90px; object-fit: cover; border-radius: 4px; }
    .frame-thumb { width: 200px; cursor: pointer; border: 2px solid transparent; }
    .frame-valid { border-color: #198754; }
    .frame-invalid { border-color: #dc3545; }
    .frame-uncertain { border-color: #ffc107; }
    .overlay { opacity: 0.5; mix-blend-mode: screen; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">SFY 数据筛选</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="/">总览</a></li>
          <li class="nav-item"><a class="nav-link" href="/frames">帧级审查</a></li>
          <li class="nav-item"><a class="nav-link" href="/segments">段列表（旧）</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container-fluid mt-3">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
