{% extends "base.html" %}
{% block title %}总览 - SFY 数据筛选{% endblock %}
{% block content %}
<div class="row g-3">
  <div class="col-md-3">
    <div class="card text-white bg-primary">
      <div class="card-body">
        <h5 class="card-title">可用视频数</h5>
        <p class="card-text display-6" id="videos-ok">-</p>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card text-white bg-secondary">
      <div class="card-body">
        <h5 class="card-title">视频段总数</h5>
        <p class="card-text display-6" id="segments-total">-</p>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card text-white bg-success">
      <div class="card-body">
        <h5 class="card-title">有效段</h5>
        <p class="card-text display-6" id="segments-valid">-</p>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card text-white bg-danger">
      <div class="card-body">
        <h5 class="card-title">无效段</h5>
        <p class="card-text display-6" id="segments-invalid">-</p>
      </div>
    </div>
  </div>
</div>

<div class="mt-4">
  <a href="/segments" class="btn btn-primary btn-lg">开始视频段审查</a>
</div>

<div class="mt-4">
  <h5>每例进度</h5>
  <div id="case-progress"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
let sessionId = localStorage.getItem('screening_session_id');

async function loadSummary() {
  const res = await fetch('/api/summary');
  const data = await res.json();
  document.getElementById('videos-ok').textContent = data.videos_ok;
  document.getElementById('segments-total').textContent = data.segments;
  document.getElementById('segments-valid').textContent = data.segment_status.valid || 0;
  document.getElementById('segments-invalid').textContent = data.segment_status.invalid || 0;
}

async function loadCaseProgress() {
  const res = await fetch('/api/videos');
  const videos = await res.json();
  const container = document.getElementById('case-progress');
  videos.forEach(v => {
    const total = v.total_segments || 0;
    const valid = v.valid_segments || 0;
    const invalid = v.invalid_segments || 0;
    const pending = v.pending_segments || 0;
    const pct = total ? Math.round((valid + invalid) / total * 100) : 0;
    const videoId = encodeURIComponent(v.video_name);
    const rowId = `video-row-${v.case}-${v.video_name.replace(/[^a-zA-Z0-9]/g, '_')}`;
    container.innerHTML += `
      <div class="mb-2" id="${rowId}">
        <div class="d-flex justify-content-between align-items-center">
          <span>病例 ${v.case} - ${v.video_name}（共 ${total} 段）</span>
          <div>
            <span class="me-2">${pct}% 已审</span>
            <button class="btn btn-sm btn-outline-danger btn-invalidate-video"
                    data-case="${v.case}" data-video="${v.video_name}" data-row="${rowId}">
              标记视频无效
            </button>
          </div>
        </div>
        <div class="progress" style="height: 18px;">
          <div class="progress-bar bg-success" style="width: ${total ? valid/total*100 : 0}%">有效 ${valid}</div>
          <div class="progress-bar bg-danger" style="width: ${total ? invalid/total*100 : 0}%">无效 ${invalid}</div>
          <div class="progress-bar bg-warning" style="width: ${total ? pending/total*100 : 0}%">待审 ${pending}</div>
        </div>
      </div>`;
  });

  document.querySelectorAll('.btn-invalidate-video').forEach(btn => {
    btn.addEventListener('click', async () => {
      const caseName = btn.dataset.case;
      const videoName = btn.dataset.video;
      const reason = prompt(`请输入病例 ${caseName} / ${videoName} 的无效原因（默认 not_ttts）：`, 'not_ttts');
      if (reason === null) return;
      if (!confirm(`确定要将整个视频 ${caseName} / ${videoName} 标记为无效吗？这将同时标记该视频下所有段和帧。`)) return;
      btn.disabled = true;
      btn.textContent = '处理中...';
      try {
        const res = await fetch(`/api/videos/${caseName}/${encodeURIComponent(videoName)}/invalidate`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({invalid_reason: reason, session_id: sessionId})
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${res.status}`);
        }
        const data = await res.json();
        alert(`已标记无效：${data.invalidated_segments} 段，${data.invalidated_frames} 帧`);
        document.getElementById(btn.dataset.row).style.opacity = '0.5';
        btn.textContent = '已无效';
      } catch (e) {
        alert('标记失败：' + e.message);
        btn.disabled = false;
        btn.textContent = '标记视频无效';
      }
    });
  });
}

loadSummary();
loadCaseProgress();
</script>
{% endblock %}
